<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>SnowCred | Contact</title>
        <meta name="description" content="Page de contact SnowCred">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>Contact</h1>
        <div class="contact_flex">
            <div class="adress">
                <h3>Adresse</h3>
                <p>
                    SnowCred SàRL<br>
                    Churerstrasse 246<br>
                    8330 Pfäffikon SZ<br>
                    Switzerland
                </p>
            </div>

            <div class="contact">
                <h3>Téléphone</h3>
                <p>+41 22 098 76 54</p>
                <h3>E-Mail</h3>
                <p>snowcred@support.ch</p>
            </div>

            <div>
                <h3>Envoyer un message</h3>
                <form action="">
                    <fieldset>
                        <label for="name_input">Votre Prénom et Nom</label>
                        <input type="text" name="name" id="name_input" placeholder="John Doe" required>
                    </fieldset>

                    <fieldset>
                        <label for="email_input">Votre E-Mail</label>
                        <input type="email" name="email" id="email_input" placeholder="john_doe@gmail.com" required>
                    </fieldset>

                    <fieldset>
                        <label for="message_text">Votre message</label>
                        <textarea name="message" id="message_text" placeholder="Entrez votre message" required rows="10" cols="30"></textarea>
                    </fieldset>

                    <button type="submit">Envoyer</button>
                </form>
            </div>
        </div>
    </body>
</html>
